# -----------------------------
# Basic terminal behavior
# Enable true color support
# -----------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# -----------------------------
# Start window and pane numbering at 1
# -----------------------------
set -g base-index 1
setw -g pane-base-index 1

# -----------------------------
# Automatically renumber windows after closing one
# -----------------------------
set -g renumber-windows on

# -----------------------------
# Make escape sequences feel more responsive
# -----------------------------
set -sg escape-time 10

# -----------------------------
# Increase scrollback history
# -----------------------------
set -g history-limit 100000

# -----------------------------
# Enable mouse support
# -----------------------------
set -g mouse on

# -----------------------------
# Easier pane splitting
# Prefix + | => split horizontally
# Prefix + - => split vertically
# -----------------------------
bind | split-window -h
bind - split-window -v

# Remove default bindings for '"' and %
unbind '"'
unbind %

# -----------------------------
# Reload config quickly
# Prefix + r
# -----------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# -----------------------------
# Vim-style pane navigation
# Prefix + h/j/k/l
# -----------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------
# Resize panes with capital H/J/K/L
# -----------------------------
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# -----------------------------
# Use vi-style keys in copy mode
# -----------------------------
setw -g mode-keys vi

# -----------------------------
# Status bar
# -----------------------------
set -g status-position bottom
set -g status-left-length 30
set -g status-right-length 100
set -g status-left "#S"
set -g status-right "#(whoami)@#H | %Y-%m-%d %H:%M"

# -----------------------------
# Window title format
# -----------------------------
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
